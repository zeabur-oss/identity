# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Change files"; docs/internal/releasing.md).
[package]
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "zeabur-identity" },
  { path = "Cargo.lock", dependency = "zeabur-identity-api" },
  { path = "Cargo.lock", dependency = "zeabur-identity-core" },
  { path = "Cargo.lock", dependency = "zeabur-identity-e2e" },
  { path = "Cargo.lock", dependency = "zeabur-identity-k8s" },
  { path = "Cargo.lock", dependency = "zeabur-identity-keys" },
  { path = "Cargo.lock", dependency = "zeabur-identity-oauth" },
  { path = "Cargo.lock", dependency = "zeabur-identity-signin" },
  { path = "Cargo.lock", dependency = "zeabur-identity-store" },
  { path = "Cargo.lock", dependency = "zeabur-identity-test-support" },
  { path = "Cargo.lock", dependency = "zeabur-identity-tls" },
  { path = "Cargo.lock", dependency = "zeabur-identity-ui" },
  { path = "Cargo.lock", dependency = "zeabur-identityctl" },
  "ui/package.json",
  { path = "deploy/chart/identity/Chart.yaml", regex = '(?m)^version: (?<version>\S+)$' },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes package.json through its JSON serializer, which drops the final newline.
[[workflows.steps]]
type = "Command"
command = "bun install --cwd ui --frozen-lockfile"

[[workflows.steps]]
type = "Command"
command = "bun run --cwd ui fmt package.json"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
