[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates, levelled from the bottom up.
zeabur-identity-core = { path = "crates/zeabur-identity-core" }
zeabur-identity-keys = { path = "crates/zeabur-identity-keys" }
zeabur-identity-store = { path = "crates/zeabur-identity-store" }
zeabur-identity-ui = { path = "crates/zeabur-identity-ui" }
zeabur-identity-tls = { path = "crates/zeabur-identity-tls" }
zeabur-identity-oauth = { path = "crates/zeabur-identity-oauth" }
zeabur-identity-signin = { path = "crates/zeabur-identity-signin" }
zeabur-identity-k8s = { path = "crates/zeabur-identity-k8s" }
zeabur-identity-test-support = { path = "crates/zeabur-identity-test-support" }

# Third-party crates.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
async-trait = "0.1"
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc", "ring-io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing", "json"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "aws-lc-rs", "tls12", "logging"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_34"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "aws-lc-rs"] }
passkey = "0.5"
passkey-types = { version = "0.5", features = ["serialize_bytes_as_base64_string"] }
proptest = "1"
public-suffix = "0.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
rustls-native-certs = "0.8.5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tower = { version = "0.5", default-features = false, features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", default-features = false, features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
url = "2"
webauthn-rs = { version = "=0.6.1-dev", features = ["conditional-ui", "danger-allow-state-serialisation"] }

# Lint policy (see CONTRIBUTING.md).
# Everything is `warn` so work in progress still compiles; CI runs with `-D warnings`.

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Duplicate versions are tracked by cargo-deny, not clippy.
multiple_crate_versions = "allow"
# Contradicts rustc's `unreachable_pub`, which we keep: items are `pub(crate)` unless exported.
redundant_pub_crate = "allow"

# Selected `restriction` lints.
# Panics on attacker-controlled input are a denial-of-service bug in an auth server.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
# Security-relevant logic must handle every case explicitly.
wildcard_enum_match_arm = "warn"
# Errors must keep their cause.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
unused_result_ok = "warn"
# Suppressions must be explicit and justified.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Output goes through `tracing`; the CLI writes through one audited module.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Hygiene.
clone_on_ref_ptr = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_inherent_impl = "warn"
partial_pub_fields = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
verbose_file_reads = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
