{%- import "ui.html" as ui -%}
{%- import "icons.html" as icons -%}
{%- import "ds.html" as ds -%}
{%- macro buttons(providers, m) -%}
{%- if !providers.is_empty() %}
<div id="upstream" class="flex flex-col gap-3">
  {%- for p in providers %}
  <button type="button" data-start="/upstream/{{ p.id }}/start" class="{{ ds::button("secondary", "lg") }} w-full">{{ icons::icon(p.icon) }}<span class="truncate">{{ m.continue_with.replace("%provider%", p.label) }}</span></button>
  {%- endfor %}
</div>
{%- endif %}
{%- endmacro -%}
