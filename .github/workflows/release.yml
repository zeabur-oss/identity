name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release runs scripts/release.ts and
# leaves a draft release (docs/internal/releasing.md). Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse (v0.1.1); a rehearsal never publishes'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@a0e7fee556f7d2e9bebfea0de11b4391a427fea7 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Identity
      version: ${{ inputs.version }}
      docs: https://oss.zeabur.com/docs/identity/
