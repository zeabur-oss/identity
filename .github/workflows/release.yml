name: Release

# A tag vX.Y.Z, on a commit whose CI passed on main, runs the shared release workflow of
# zeabur-oss/.github: `scripts/release.sh` stage by stage, leaving a draft prerelease. By hand, it rehearses a version
# (builds and smoke tests, nothing published) or, with verify_only, checks an existing draft again.
# docs/internal/releasing.md has the procedure.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Identity
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
