name: Release

# A tag vX.Y.Z reruns CI on its commit, then the shared release workflow of zeabur-oss/.github runs
# `scripts/release.sh` stage by stage and leaves a draft prerelease. By hand, it rehearses a version
# (builds and smoke tests, nothing published) or, with verify_only, checks an existing draft again.
# docs/internal/releasing.md has the procedure.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || inputs.verify_only) }}
    uses: zeabur-oss/.github/.github/workflows/release.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Identity
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
