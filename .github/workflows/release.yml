name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build and smoke the CLI and the image on both
# architectures, push the image and the Helm chart by digest, sign it and attest its SBOMs, create the draft release
# with the assets, and verify the draft on both architectures (docs/internal/releasing.md). A
# maintainer publishes the draft. Manual run: rehearse, which builds and smokes and publishes
# nothing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: instabox-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: The version is the crates' and the UI's, with a CHANGELOG.md section, on main
        run: |
          versions=()
          for version in $(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u) \
            "$(jq -r .version ui/package.json)"; do
            versions+=(--version "$version")
          done
          bun x zeabur-oss-release check-tag "$VERSION" --changelog CHANGELOG.md "${versions[@]}" \
            ${{ github.event_name != 'push' && '--rehearsal' || '' }}

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
      - name: Build the CLI and the image, and smoke them on k3s
        run: scripts/release-build.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the image and the chart on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: candidates
      - id: publish
        name: Push the image and the chart by digest, sign them and attest the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          plain=${VERSION#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}:$plain
          bun x zeabur-oss-release unpublished "$VERSION"
          crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          bun x zeabur-oss-release absent "$image" "ghcr.io/$owner/charts/identity:$plain"
          # The chart runs the image pinned to the index just pushed.
          cp -r deploy/chart/identity chart
          bun x zeabur-oss-release push-image --out published --pin chart/values.yaml:image "$image" \
            linux/amd64=candidates/candidate-amd64/image.tar linux/arm64=candidates/candidate-arm64/image.tar
          helm lint --strict chart --set global.domain=203.0.113.1.sslip.io
          helm package chart --destination published
          bun x zeabur-oss-release push-chart --out published "oci://ghcr.io/$owner/charts" "published/identity-$plain.tgz"
          # Each platform image carries its own SBOM; the index carries both.
          index=$(awk '$1 == "index" { print $2 }' published/digests.txt)
          for arch in amd64 arm64; do
            sbom=candidates/candidate-$arch/zeabur-identity-$VERSION-linux-$arch.cdx.json
            for ref in "$(awk -v p="linux/$arch" '$1 == p { print $2 }' published/digests.txt)" "$index"; do
              cosign attest --yes --type cyclonedx --predicate "$sbom" "$ref"
            done
          done
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }}@${{ matrix.digest }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: instabox-small
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  release:
    needs: [publish, attest]
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: published
      - name: Make the release assets
        run: |
          mkdir assets
          cp candidates/*/*.tar.gz candidates/*/*.cdx.json published/digests.txt assets/
          # The CLI of this release lists the Kubernetes resources it installs.
          tar -xOzf "candidates/candidate-amd64/zeabur-identityctl-$VERSION-linux-amd64.tar.gz" \
            zeabur-identityctl >"$RUNNER_TEMP/zeabur-identityctl"
          chmod +x "$RUNNER_TEMP/zeabur-identityctl"
          "$RUNNER_TEMP/zeabur-identityctl" resources >assets/resources.json
      - uses: zeabur-oss/.github/actions/release-draft@fe73a0c68d3ef4b7557f15f7987f59f555714788 # main
        with:
          version: ${{ env.VERSION }}
          name: Zeabur Identity
          docs: https://oss.zeabur.com/docs/identity/

  verify:
    name: verify (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - uses: zeabur-oss/.github/actions/release-verify@fe73a0c68d3ef4b7557f15f7987f59f555714788 # main
        with:
          version: ${{ env.VERSION }}
      - name: Verify the image and its SBOM, and smoke them
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ env.VERSION }}
        run: scripts/release-verify.sh "$VERSION" downloaded
