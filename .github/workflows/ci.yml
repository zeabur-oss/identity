name: CI

# Every job of `scripts/ci.sh --list`, each as `scripts/ci.sh <job>` through the shared workflow of
# zeabur-oss/.github; the script enters the Nix dev shell itself, so a job runs the same locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs all of CI on the commit it releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
    with:
      # `fallow audit` in the ui job compares HEAD with HEAD^.
      fetch-depth: 2
      rust-cache: true
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
