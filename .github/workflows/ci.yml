name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally, except docs, which
# runs the website's check of docs/ (locally: bun scripts/docs-check.ts <this checkout> in the
# website). Pull requests and pushes run lint, test, ui and docs. The merge queue runs every job on the commit about to land, and the
# nightly run keeps main's caches for the merge queue's jobs.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
        with:
          rust-cache: true
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsafe-report
          path: target/unsafe-report.md
          if-no-files-found: ignore
          retention-days: 14

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/test.sh

  ui:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fallow audit compares HEAD with HEAD^.
          fetch-depth: 2
      - uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/ui.sh

  kubernetes:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/kubernetes.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    runs-on: instabox-small
    timeout-minutes: 10
    steps:
      - uses: zeabur-oss/website/.github/actions/docs-check@a87b42163152b49e81886eb222e1853388f80d1e # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, ui, kubernetes, docs]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

