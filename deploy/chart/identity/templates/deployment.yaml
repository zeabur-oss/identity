{{- /* files/deployment.json is the Service and Deployment of `zeabur-identityctl manifests`, which a test keeps current. Only what the values choose is set here. */ -}}
{{- range (.Files.Get "files/deployment.json" | fromJson).items }}
---
{{- $object := deepCopy . }}
{{- $labels := merge (fromYaml (include "identity.labels" $)) ($object.metadata.labels | default dict) }}
{{- $_ := set $object.metadata "labels" $labels }}
{{- if eq $object.kind "Deployment" }}
{{- $pod := $object.spec.template }}
{{- $_ := set $pod.metadata "labels" (merge (dict) $labels ($.Values.podLabels | default dict)) }}
{{- with $.Values.podAnnotations }}
{{- $_ := set $pod.metadata "annotations" . }}
{{- end }}
{{- $spec := $pod.spec }}
{{- range $key := list "imagePullSecrets" "nodeSelector" "tolerations" "affinity" }}
{{- with index $.Values $key }}
{{- $_ := set $spec $key . }}
{{- end }}
{{- end }}
{{- $container := index $spec.containers 0 }}
{{- $_ := set $container "image" (include "identity.image" $) }}
{{- $_ := set $container "imagePullPolicy" $.Values.image.pullPolicy }}
{{- if $.Values.invitations }}
{{- $_ := set $container "args" (list "--invitations") }}
{{- end }}
{{- range $container.env }}
{{- if eq .name "ZEABUR_IDENTITY_ISSUER" }}
{{- $_ := set . "value" (include "identity.issuer" $) }}
{{- end }}
{{- end }}
{{- with $.Values.resources }}
{{- $_ := set $container "resources" . }}
{{- end }}
{{- end }}
{{ toYaml $object }}
{{- end }}
