{{- /*
The first administrator's setup link. The token is made here and shown in NOTES; the setup Secret
must be owned by the User's UID, which exists only once the User does, so a post-install Job
stores the token's hash with `zeabur-identity setup-link`, as `zeabur-identityctl setup-link` would.
*/ -}}
{{- if .Values.admin.setupLink }}
{{- $hook := dict "helm.sh/hook" "post-install" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeabur-identity-setup
  namespace: {{ include "identity.namespace" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-1") $hook) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeabur-identity-setup
  namespace: {{ include "identity.namespace" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-1") $hook) | nindent 4 }}
rules:
  - apiGroups: [identity.zeabur.com]
    resources: [users]
    verbs: [get, create]
  - apiGroups: [identity.zeabur.com]
    resources: [credentials]
    verbs: [list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [zeabur-identity-setup]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeabur-identity-setup
  namespace: {{ include "identity.namespace" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-1") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeabur-identity-setup
subjects:
  - kind: ServiceAccount
    name: zeabur-identity-setup
    namespace: {{ include "identity.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zeabur-identity-setup
  namespace: {{ include "identity.namespace" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: zeabur-identity-setup
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup-link
          image: {{ include "identity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - setup-link
            - --user={{ .Values.admin.user }}
            - --valid-for={{ .Values.admin.validFor }}
            - --token-hash=sha256:{{ include "identity.setupToken" . | sha256sum }}
          env:
            - name: ZEABUR_IDENTITY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
