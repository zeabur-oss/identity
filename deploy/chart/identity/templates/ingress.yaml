{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeabur-identity
  namespace: {{ include "identity.namespace" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if .Values.ingress.clusterIssuer }}
  {{- $annotations = merge (dict "cert-manager.io/cluster-issuer" .Values.ingress.clusterIssuer) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ include "identity.host" . | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ include "identity.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeabur-identity
                port:
                  name: http
{{- end }}
